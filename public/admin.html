<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>설문 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<header class="hd">
  <div class="wrap hd-in">
    <b>광고 해석 설문 · 관리자</b>
    <span id="env" class="tag" hidden></span>
    <span class="sp"></span>
    <span id="who" class="mut"></span>
    <button id="logout" type="button" class="lnk" hidden>로그아웃</button>
  </div>
</header>

<main class="wrap">
  <section id="login" class="card narrow" hidden>
    <h1>관리자 로그인</h1>
    <p class="mut">Firebase Authentication에 등록하고 관리자로 지정한 계정만 응답을 볼 수 있습니다.</p>
    <form id="lf">
      <label>이메일<input id="em" type="email" autocomplete="username" required></label>
      <label>비밀번호<input id="pw" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">로그인</button>
      <p id="lerr" class="err" role="alert"></p>
    </form>
  </section>

  <section id="denied" class="card narrow" hidden>
    <h1>관리자 권한이 없습니다</h1>
    <p>이 계정(<span id="duid"></span>)은 관리자로 지정되어 있지 않습니다. README의 ‘관리자 계정 등록’을 따라 Firestore <code>admins/{uid}</code> 문서를 만든 뒤 다시 로그인하세요.</p>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <button id="reload" class="btn sm" type="button">응답 불러오기</button>
      <span id="loaded" class="mut"></span>
      <span class="sp"></span>
      <button id="dlraw" class="btn sm ghost" type="button" disabled>원자료 CSV</button>
      <button id="dlsum" class="btn sm ghost" type="button" disabled>집계 CSV</button>
    </div>

    <div class="filters card">
      <label>테스트 응답
        <select id="f-test"><option value="exclude">제외</option><option value="include">포함</option><option value="only">테스트만</option></select></label>
      <label>진행 상태(문항 집계·응답 목록)
        <select id="f-status"><option value="complete">완료</option><option value="all">전체</option><option value="in_progress">진행 중</option><option value="screened_out">선별 탈락</option><option value="quit">중단</option></select></label>
      <label>설문 버전
        <select id="f-version"><option value="all">전체</option></select></label>
      <label>모집 링크
        <select id="f-link"><option value="all">전체</option><option value="young">young</option><option value="older">older</option><option value="unknown">없음·잘못된 값</option></select></label>
      <p class="mut small">기본 분석은 <b>테스트 제외 · 완료 응답</b>입니다. 현황 표는 진행 상태 필터와 관계없이 테스트·버전·링크 필터만 적용합니다.</p>
    </div>

    <div id="out"></div>
  </section>
</main>

<dialog id="dlg"><div id="dlgbody"></div><form method="dialog"><button class="btn sm">닫기</button></form></dialog>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
