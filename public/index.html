<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>광고 사진 읽기 조사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/survey.css">
</head>
<body>
<div class="col" id="root">
  <div class="top"><div class="bar"><i id="pbar"></i></div><div class="meta"><span id="sec"></span><span id="svst" class="svst" hidden></span><button id="quit" type="button" hidden>그만하기</button></div></div>
  <main id="main" aria-live="polite"></main>
</div>
<div class="act" id="act"><div class="col"><button class="btn ghost" id="prev" type="button" hidden>이전</button><button class="btn" id="next" type="button" disabled>다음</button></div></div>
<div id="lb" hidden><img alt="광고 사진 크게 보기"><button class="btn" type="button" style="flex:none;min-width:200px">닫기</button></div>
<div id="sheet" hidden><div class="card"><p style="font-weight:700;font-size:20px">조사를 그만할까요?</p><p class="hint">지금까지의 답은 분석에서 제외됩니다. 언제든 다시 처음부터 하실 수 있습니다.</p><div class="row"><button class="btn ghost" id="cont" type="button" style="flex:1">계속하기</button><button class="btn" id="stop" type="button">그만하기</button></div></div></div>
<script type="module" src="/js/survey.js"></script>
<noscript><p>이 설문은 자바스크립트가 켜져 있어야 진행할 수 있습니다.</p></noscript>
</body>
</html>
