<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>광고 사진 읽기 조사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one question per screen, thumb-reach footer button, banner pinned above the question while answering. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --ink:#14232B; --muted:#566872; --line:#D3DCE0;
  --accent:#0E5F73; --accent-ink:#FFFFFF; --accent-soft:#DCEEF2; --chip:#E7EDF0; --danger:#9B2C2C;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-head:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hh:52px; color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.col{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);height:var(--hh);display:flex;flex-direction:column;justify-content:center;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);min-height:24px}
.meta button{background:none;border:0;padding:4px 0 4px 12px;color:var(--muted);font-size:15px;text-decoration:underline}

main{padding-bottom:130px;min-width:0}
h1.q{font:600 23px/1.5 var(--f-head);margin:18px 0 6px;text-wrap:balance;outline:none}
h1.t{font:600 26px/1.45 var(--f-head);margin:24px 0 12px;text-wrap:balance;outline:none}
p{margin:0 0 12px}
.hint{color:var(--muted);font-size:16px;margin:0 0 12px}
.chip{display:inline-block;background:var(--chip);color:var(--muted);border-radius:999px;padding:3px 12px;font-size:15px;margin:14px 0 0}
.lead{font-size:19px}
ul.rules{padding:0;margin:16px 0;list-style:none;display:grid;gap:12px}
ul.rules li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.55}
ul.rules b{font-weight:700}
.agree{display:flex;gap:14px;align-items:center;margin:18px 0 6px;font-size:20px;font-weight:700;line-height:1.4;padding:16px;min-height:64px;background:var(--surface);border:2px solid var(--muted);border-radius:14px;cursor:pointer}
.agree span{word-break:keep-all}
.agree:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.agree input{-webkit-appearance:none;appearance:none;flex:none;width:30px;height:30px;margin:0;border:3px solid var(--muted);border-radius:8px;background:#fff;display:grid;place-items:center;cursor:pointer}
.agree input:checked{background:var(--accent);border-color:var(--accent)}
.agree input:checked::after{content:"";width:9px;height:16px;border:solid var(--accent-ink);border-width:0 4px 4px 0;transform:translateY(-1px) rotate(45deg)}
.agree input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.stage{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;margin:12px 0 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh) + 4px);z-index:10;text-align:center}
.stage img{display:block;margin:0 auto;max-width:100%;max-height:26vh;width:auto;height:auto;object-fit:contain}
.stage small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.stage.sm{padding:6px}
.stage.sm img{max-height:17vh}
.stage.sm small{font-size:13px;margin-top:2px}
.big{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:18px 0 10px;text-align:center}
.big img{display:block;margin:0 auto;max-width:100%;max-height:68vh;width:auto;height:auto}
.count{display:flex;align-items:center;gap:12px;margin:12px 0}
.count .track{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.count .track i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.count b{font:600 24px var(--f-head);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}

.opts{display:grid;gap:10px;margin:14px 0 0}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:60px;padding:12px 16px;background:var(--surface);border:2px solid var(--line);border-radius:14px;font-size:19px;line-height:1.45}
.opt .mk{flex:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center}
.opt.multi .mk{border-radius:7px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .mk{background:var(--accent);border-color:var(--accent)}
.opt.on .mk::after{content:"";width:8px;height:14px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.opt .tx{min-width:0;overflow-wrap:anywhere}
.opt img{flex:none;width:96px;max-height:64px;object-fit:contain;border-radius:6px;background:var(--bg)}
.oth{width:100%;margin-top:10px;min-height:56px;font:inherit;font-size:18px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
textarea.oth{min-height:150px;resize:vertical}
.conf{margin-top:22px;padding-top:6px;border-top:1px solid var(--line);scroll-margin-bottom:150px}
.conf p{font-weight:500;margin:14px 0 8px}
.conf p.mine{margin:12px 0 0;padding:10px 14px;background:var(--accent-soft);border-radius:10px;font-weight:700;color:var(--ink,inherit)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sc{min-height:60px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font:600 22px var(--f-head)}
.sc.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;margin-top:6px}

.act{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.act .col{display:flex;gap:10px}
.btn{flex:1;min-height:58px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 20px var(--f-head)}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{flex:0 0 32%;background:transparent;color:var(--accent)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--muted);margin:14px 0}
.note.warn{border-color:var(--danger);color:var(--danger)}
.code{font:600 30px var(--f-head);letter-spacing:.12em;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.mini{font-size:15px;color:var(--muted)}
.mini button{background:none;border:0;padding:6px 0;text-decoration:underline;color:var(--muted);font-size:15px}
table.adm{border-collapse:collapse;font-size:15px;width:100%}
table.adm td,table.adm th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}

#lb,#sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:color-mix(in srgb,var(--bg) 96%,transparent);overflow:auto}
#lb img{max-width:100%;max-height:78vh;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
#sheet .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%}
#sheet .card .row{display:flex;gap:10px;margin-top:14px}
</style>

<div class="col" id="root">
  <div class="top"><div class="bar"><i id="pbar"></i></div><div class="meta"><span id="sec"></span><button id="quit" type="button" hidden>그만하기</button></div></div>
  <main id="main" aria-live="polite"></main>
</div>
<div class="act" id="act"><div class="col"><button class="btn ghost" id="prev" type="button" hidden>이전</button><button class="btn" id="next" type="button" disabled>다음</button></div></div>
<div id="lb" hidden><img alt="광고 사진 크게 보기"><button class="btn" type="button" style="flex:none;min-width:200px">닫기</button></div>
<div id="sheet" hidden><div class="card"><p style="font-weight:700;font-size:20px">조사를 그만할까요?</p><p class="hint">지금까지의 답은 분석에서 제외됩니다. 언제든 다시 처음부터 하실 수 있습니다.</p><div class="row"><button class="btn ghost" id="cont" type="button" style="flex:1">계속하기</button><button class="btn" id="stop" type="button">그만하기</button></div></div></div>

function snapshot(){
  return {id:S.id,status:S.status,endReason:S.endReason,test:S.test,group:S.group,cond:S.cond,order:S.order,orderSrc:S.orderSrc,
    expSec:S.expSec,vw:S.vw,vh:S.vh,startedAt:S.startedAt,updatedAt:new Date().toISOString(),finishedAt:S.finishedAt,
    ans:JSON.parse(JSON.stringify(S.ans)),ms:JSON.parse(JSON.stringify(S.ms||{})),optOrder:JSON.parse(JSON.stringify(S.shuf))};
}
function writeNow(doc){
  return Promise.resolve().then(function(){
    if(DB){ return DB.doc('responses/'+doc.id).set(doc).then(function(){ lastSave={ok:true,how:'db'}; }); }
    if(CONFIG.endpoint){ return fetch(CONFIG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(doc)}).then(function(){ lastSave={ok:true,how:'endpoint'}; }); }
    lastSave={ok:false,how:'none'};
  }).catch(function(){ lastSave={ok:false,how:'error'}; });
}
function save(now){
  clearTimeout(saveT);
  var go=function(){ var doc=snapshot(); chain=chain.then(function(){return writeNow(doc)}); return chain; };
  if(now) return go();
  saveT=setTimeout(go,1200); return chain;
}

/* ---------- 흐름 이동 ---------- */
function skipped(ix){ var st=FLOW[ix]; return !!(st&&st.skip&&st.skip()); }
function nextIdx(i){ var j=i+1; while(j<FLOW.length&&skipped(j)) j++; return j; }
function prevIdx(i){
  var j=i-1; while(j>=0&&skipped(j)) j--;
  if(j<0) return -1;
  var a=FLOW[j], b=FLOW[i];
  if(a.type!=='q'||b.type!=='q'||a.phase!==b.phase) return -1;
  return j;
}
function progress(){
  var tot=0, done=0;
  for(var k=0;k<FLOW.length;k++){ if(skipped(k)) continue; tot++; if(k<S.i) done++; }
  return tot?done/tot:0;
}

}
function orderedOpts(st){
  var o=st.opts, fixed=[], free=[];
  o.forEach(function(x){ ((x[2]||'').indexOf('fix')>-1?fixed:free).push(x); });
  if(!st.shuffle) return o;
  var key=st.id;
  if(!S.shuf[key]){ S.shuf[key]=shuffle(free).map(function(x){return x[0]}).concat(fixed.map(function(x){return x[0]})); }
  return S.shuf[key].map(function(v){ return o.filter(function(x){return x[0]===v})[0]; });
}
function isOn(st,v){ var a=S.ans[st.id]; return st.kind==='multi'?(Array.isArray(a)&&a.indexOf(v)>-1):a===v; }
function mineText(st){
  var v=S.ans[st.id]; if(v===undefined) return '';
  var o=st.opts.filter(function(x){return x[0]===v})[0]; return o?('고른 답: ‘'+o[1]+'’'):'';
}
function otherVal(st){ var f=st.opts.filter(function(x){return (x[2]||'').indexOf('other')>-1})[0]; return f?f[0]:null; }

  var a=S.ans[st.id];
  var ok= st.kind==='multi'?(Array.isArray(a)&&a.length>0):(a!==undefined&&a!==null);
  if(ok&&st.conf) ok=S.ans[st.conf]!==undefined;
  return ok;
}

  stopTimer();
  tm=setInterval(function(){
    var left=Math.max(0,dur-(performance.now()-t0));
    bar.style.transform='scaleX('+(left/dur)+')'; num.textContent=Math.ceil(left/1000);
    if(left<=0){ stopTimer(); go(nextIdx(S.i)); }
  },100);
}
function stopTimer(){ if(tm){ clearInterval(tm); tm=null; } }

function render(){
  var st=FLOW[S.i];
  window.scrollTo(0,0);
  $('#pbar').style.width=Math.round(progress()*100)+'%';
  $('#sec').textContent=st.sec||'';
  $('#quit').hidden=(st.type==='consent'||st.type==='end');
  var inExp=(st.type==='exposure');
  $('#act').hidden=inExp||st.type==='end';
  var pv=(st.type==='q')?prevIdx(S.i):-1; prevB.hidden=(pv<0);
  if(st.type==='consent') renderConsent();
  else if(st.type==='info') renderInfo(st);
  else if(st.type==='exposure') renderExposure(st);
  else if(st.type==='q') renderQ(st);
  var h=main.querySelector('h1'); if(h&&!inExp){ try{h.focus({preventScroll:true})}catch(e){} }
}
/* 화면별 응답 시간(ms). 다른 앱·탭에 가 있던 시간은 뺀다. 되돌아가 다시 답하면 누적. */
var T0=0, H0=0, hidAcc=0, hidStart=null;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ hidStart=Date.now(); }
  else if(hidStart){ hidAcc+=Date.now()-hidStart; hidStart=null; }
});
function markScreen(){ T0=Date.now(); H0=hidAcc+(hidStart?Date.now()-hidStart:0); }
function tick(st){
  if(!st||st.type!=='q'||!T0) return;
  var now=Date.now(), hid=hidAcc+(hidStart?now-hidStart:0)-H0, d=now-T0-hid;
  if(d<0) d=0;
  S.ms[st.id]=(S.ms[st.id]||0)+d; T0=0;
}
function go(j){
  if(j>=FLOW.length){ finish(); return; }
  S.i=j; render(); markScreen();
}

/* ---------- 끝내기 ---------- */
function code6(){ return S.id.replace(/[^a-z0-9]/gi,'').slice(0,6).toUpperCase(); }
function endScreen(kind){
  stopTimer();
  $('#act').hidden=true; $('#quit').hidden=true; $('#pbar').style.width='100%';
  var h='';
  if(kind==='screened') h='<h1 class="t" tabindex="-1">참여해 주셔서 감사합니다</h1><p class="lead">이번 조사는 정해진 조건에 맞는 분들께만 진행하고 있어서, 여기서 마무리하겠습니다. 시간 내어 주셔서 정말 감사드립니다.</p>';
  else if(kind==='quit') h='<h1 class="t" tabindex="-1">그만두셨습니다</h1><p class="lead">참여해 주셔서 감사합니다. 지금까지의 답은 분석에서 제외됩니다.</p>';
  else {
    h='<h1 class="t" tabindex="-1">모두 끝났습니다</h1><p class="lead">시간 내어 주셔서 감사합니다.</p>'+
    '<p class="hint">완료 번호</p><div class="code">'+esc(code6())+'</div>'+
    '<p class="mini">사례를 약속받으셨다면 이 번호를 링크를 보내 드린 분께 알려 주세요.</p><div id="savebox"></div>';
  }
  main.innerHTML=h; $('#sec').textContent='';
  var hh=main.querySelector('h1'); if(hh) hh.focus({preventScroll:true});
  if(kind==='done') showSaveState();
}
function showSaveState(){
  var box=$('#savebox'); if(!box) return;
  chain.then(function(){
    if(lastSave.ok){ box.innerHTML='<p class="note">답이 저장되었습니다.</p>'; return; }
    var txt=JSON.stringify(snapshot());
    box.innerHTML='<p class="note warn">답이 자동으로 저장되지 않았습니다. 아래 내용을 복사해서 링크를 보내 드린 분께 보내 주세요.</p>'+
      '<textarea id="out" class="oth" readonly rows="5"></textarea><div style="margin-top:10px"><button class="btn" id="cp" type="button">내용 복사</button></div>';
    var ta=$('#out'); ta.value=txt;
    $('#cp').addEventListener('click',function(){ copyText(txt,ta,$('#cp')); });
  });
}
function copyText(txt,ta,btn){
  var ok=function(){ btn.textContent='복사했습니다'; };
  var fb=function(){ try{ ta.focus(); ta.select(); ta.setSelectionRange(0,txt.length); btn.textContent='선택됨 · 길게 눌러 복사'; }catch(e){} };
  try{ navigator.clipboard.writeText(txt).then(ok,fb); }catch(e){ fb(); }
}
function finish(){
  S.status='complete'; S.finishedAt=new Date().toISOString();
  save(true); endScreen('done');
}
function endNow(reason){
  S.status='screened_out'; S.endReason=reason; S.finishedAt=new Date().toISOString();
  save(true); endScreen('screened');
}
function quitNow(){
  S.status='quit'; S.finishedAt=new Date().toISOString();
  save(true); endScreen('quit');
}

/* ---------- 연구자 메뉴(수정 권한이 있는 사람에게만) ---------- */
function adminPanel(){
  var el=$('#adm'); if(!el||!DB||!USER) return;
  Promise.resolve(USER.canEdit()).then(function(ok){
    if(!ok) return;
    el.innerHTML='<div class="note"><b>연구자 메뉴</b> (수정 권한이 있는 사람에게만 보입니다)<div id="admbody" style="margin-top:8px">불러오는 중…</div><div class="mini" style="margin-top:6px">테스트로 해 보려면 주소 끝에 #test 를 붙이세요. 테스트 응답은 아래 집계에서 빠집니다.</div></div>';
    DB.collection('responses').onSnapshot(function(snap){
      var rows=[]; snap.forEach(function(d){ rows.push(d.data()); });
      showAdmin(rows);
    },function(){ var b=$('#admbody'); if(b) b.textContent='응답을 읽지 못했습니다.'; });
  });
}
function showAdmin(rows){
  var b=$('#admbody'); if(!b) return;
  var real=rows.filter(function(r){return !r.test});
  var c=function(f){return real.filter(f).length};
  b.innerHTML='<table class="adm"><tr><th>구분</th><th>수</th></tr>'+
   '<tr><td>전체 시작</td><td>'+real.length+'</td></tr>'+
   '<tr><td>끝까지 완료 · 50~60대</td><td>'+c(function(r){return r.status==='complete'&&r.group==='50-60'})+'</td></tr>'+
   '<tr><td>끝까지 완료 · 20~30대</td><td>'+c(function(r){return r.status==='complete'&&r.group==='20-30'})+'</td></tr>'+
   '<tr><td>선별에서 종료</td><td>'+c(function(r){return r.status==='screened_out'})+'</td></tr>'+
   '<tr><td>중단·진행 중</td><td>'+c(function(r){return r.status==='quit'||r.status==='in_progress'})+'</td></tr></table>'+
   '<div style="margin-top:10px"><button class="btn" id="tsv" type="button" style="min-height:48px;font-size:17px">완료 응답 복사(엑셀에 붙여넣기)</button></div><textarea id="tsvout" class="oth" rows="3" hidden></textarea>';
  $('#tsv').addEventListener('click',function(){
    var done=real.filter(function(r){return r.status==='complete'}), keys={};
    done.forEach(function(r){ Object.keys(r.ans||{}).forEach(function(k){keys[k]=1}); });
    var ks=Object.keys(keys).sort(), mk={};
    done.forEach(function(r){ Object.keys(r.ms||{}).forEach(function(k){mk[k]=1}); });
    var mks=Object.keys(mk).sort();
    var head=['id','group','cond','order','expSec','startedAt','finishedAt'].concat(ks).concat(mks.map(function(k){return 'ms_'+k}));
    var cell=function(v){ if(Array.isArray(v)) v=v.join(','); if(v===undefined||v===null) v=''; return String(v).replace(/[\t\r\n]+/g,' '); };
    var lines=[head.join('\t')].concat(done.map(function(r){
      return [r.id,r.group,r.cond,(r.order||[]).join('-'),r.expSec,r.startedAt,r.finishedAt].concat(ks.map(function(k){return r.ans[k]})).concat(mks.map(function(k){return (r.ms||{})[k]})).map(cell).join('\t');
    }));
    var txt=lines.join('\n'), ta=$('#tsvout'); ta.hidden=false; ta.value=txt; copyText(txt,ta,$('#tsv'));
  });
}

/* ---------- 이벤트 ---------- */
main.addEventListener('click',function(e){
  var st=FLOW[S.i]; if(!st||st.type!=='q') return;
  var z=e.target.closest('[data-zoom]');
  if(z){ var lb=$('#lb'); lb.querySelector('img').src=IMG[z.getAttribute('data-zoom')]; lb.hidden=false; return; }
  var o=e.target.closest('.opt');
  if(o){
    var v=+o.getAttribute('data-v'), opt=st.opts.filter(function(x){return x[0]===v})[0], fl=(opt[2]||'');
    if(st.kind==='single'){ S.ans[st.id]=v; }
    else {
      var a=Array.isArray(S.ans[st.id])?S.ans[st.id].slice():[], at=a.indexOf(v);
      if(at>-1) a.splice(at,1);
      else {
        if(fl.indexOf('excl')>-1) a=[v];
        else {
          a=a.filter(function(x){ var xo=st.opts.filter(function(y){return y[0]===x})[0]; return (xo[2]||'').indexOf('excl')<0; });
          a.push(v); if(st.max&&a.length>st.max) a.shift();
        }
      }
      S.ans[st.id]=a;
    }
    var ov=otherVal(st);
    if(ov!==null&&!isOn(st,ov)) delete S.ans[st.id+'_text'];
    main.querySelectorAll('.opt').forEach(function(b){
      var on=isOn(st,+b.getAttribute('data-v')); b.classList.toggle('on',on); b.setAttribute('aria-checked',on);
    });
    var oi=$('#oth'); if(oi){ oi.hidden=!isOn(st,ov); if(!oi.hidden&&st.kind==='single') oi.focus({preventScroll:true}); }
    var mn=$('#mine'); if(mn) mn.textContent=mineText(st);
    var cf=$('#conf'); if(cf){ var was=cf.hidden; cf.hidden=false; if(was){ try{ cf.scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){} } }
    updateNext(st); save(); return;
  }
  var sc=e.target.closest('.sc');
  if(sc){
    S.ans[st.conf]=+sc.getAttribute('data-c');
    main.querySelectorAll('.sc').forEach(function(b){ b.classList.toggle('on',+b.getAttribute('data-c')===S.ans[st.conf]); });
    updateNext(st); save();
  }
});
main.addEventListener('input',function(e){
  var st=FLOW[S.i];
  if(e.target.id==='agree'){ S.agreed=e.target.checked; nextB.disabled=!S.agreed; }
  else if(e.target.id==='oth'){ S.ans[st.id+'_text']=e.target.value; save(); }
  else if(e.target.id==='ta'){ S.ans[st.id]=e.target.value; save(); }
});
main.addEventListener('change',function(e){ if(e.target.id==='agree'){ S.agreed=e.target.checked; nextB.disabled=!S.agreed; } });
nextB.addEventListener('click',function(){
  var st=FLOW[S.i];
  if(st.type==='consent'){ if(!S.agreed) return; S.ans.consent=1; save(); go(nextIdx(S.i)); return; }
  if(st.type==='info'){ go(nextIdx(S.i)); return; }
  if(st.type!=='q'||!answered(st)) return;
  tick(st);
  var v=S.ans[st.id];
  if(st.after) st.after(v);
  var r=st.end?st.end(v):'';
  if(r){ endNow(r+':'+st.id); return; }
  if(nextIdx(S.i)>=FLOW.length){ finish(); return; }
  save(); go(nextIdx(S.i));
});
prevB.addEventListener('click',function(){ var p=prevIdx(S.i); if(p>=0){ tick(FLOW[S.i]); go(p); } });
$('#quit').addEventListener('click',function(){ $('#sheet').hidden=false; $('#cont').focus(); });
$('#cont').addEventListener('click',function(){ $('#sheet').hidden=true; });
$('#stop').addEventListener('click',function(){ $('#sheet').hidden=true; quitNow(); });
$('#lb').addEventListener('click',function(){ $('#lb').hidden=true; });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ $('#lb').hidden=true; $('#sheet').hidden=true; } });
document.addEventListener('visibilitychange',function(){
  if(!document.hidden||!tm||!S) return;
  var st=FLOW[S.i]; stopTimer();
  var k='s'+st.banner+'_restarts'; S.ans[k]=(S.ans[k]||0)+1;
  S.notice='다른 앱으로 나가서 처음부터 사진을 다시 보여 드립니다.'; save();
  S.i=S.i-1; render();
});

/* ---------- 시작 ---------- */
S=newState(); FLOW=buildFlow(S.order); render(); markScreen();
DB=undefined;
if(window.claude&&window.claude.use){
  Promise.all([
    window.claude.use('db').catch(function(){return null}),
    window.claude.use('user').catch(function(){return null})
  ]).then(function(r){ DB=r[0]||null; USER=r[1]||null; if(FLOW[S.i].type==='consent'){ dbNote(); adminPanel(); } });
} else { DB=null; dbNote(); }
if(S.test){ $('#sec').textContent='테스트'; }
})();
</script>

</body></html>
